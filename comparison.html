
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before & After Comparison</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

<div class="logo">

<img src="images/logo.png">

<span>GP3D</span>

</div>

<nav>

<a href="index.html">Home</a>

<a href="portfolio.html">Portfolio</a>

</nav>

</header>

<section class="hero">

<h2>Before & After Satellite Comparison</h2>

<p>Drag the slider to compare satellite images.</p>

</section>

<div class="comparison-container">

<img src="./images/comparison/before.jpg"

class="before">

<div class="after-wrapper"

id="afterWrapper">

<img src="./images/comparison/after.jpg"

class="after">

</div>

<input type="range"

id="compareSlider"

min="0"

max="100"

value="50">

</div>

<script>

const slider=document.getElementById("compareSlider");

const after=document.getElementById("afterWrapper");

slider.addEventListener("input",()=>{

after.style.width=slider.value+"%";

});

</script>
