
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="hero">

<h2>Student Portal</h2>


<form id="loginForm">

<input id="name" type="text" placeholder="Full Name" required>

<input id="email" type="email" placeholder="Email" required>

<select id="course">

<option>Google Earth Engine</option>

<option>ArcGIS Pro</option>

<option>QGIS</option>

<option>Surfer</option>

</select>

<button type="submit">

Start Training

</button>

</form>

</section>


<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const today = new Date();

    const student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        course: document.getElementById("course").value,

        // Save the exact date of registration
        registrationDate: today.toISOString(),

        // Save the training year permanently
        trainingYear: today.getFullYear(),

        // Permanent certificate number
        certificateNumber:
            "GPE-" +
            today.getFullYear() +
            "-" +
            Math.floor(100000 + Math.random() * 900000)
    };

    localStorage.setItem("studentData", JSON.stringify(student));

    window.location = "student.html";
});

</script>
